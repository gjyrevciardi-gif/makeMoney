services:
  postgres-test:
    image: postgres:16-alpine
    container_name: toto-postgres-test
    environment:
      POSTGRES_USER: test_runner
      POSTGRES_PASSWORD: test_runner
      POSTGRES_DB: toto_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_runner -d toto_test"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    container_name: toto-redis-test
    ports:
      - "127.0.0.1:56380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_test_data:
