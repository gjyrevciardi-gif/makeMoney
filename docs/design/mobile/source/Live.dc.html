<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.E = {
      livmci: { sport: 'football', home: 'Liverpool', away: 'Manchester City', hs: [2], as: [1], min: 67, sec: 12, odds: [1.36, 4.80, 9.50], labels: ['1', 'X', '2'], tv: true },
      intjuv: { sport: 'football', home: 'Inter', away: 'Juventus', hs: [0], as: [0], min: 23, sec: 40, odds: [2.40, 2.90, 3.60], labels: ['1', 'X', '2'], tv: true },
      ajapsv: { sport: 'football', home: 'Ajax', away: 'PSV', hs: [1], as: [2], min: 81, sec: 5, odds: [9.00, 4.10, 1.40], labels: ['1', 'X', '2'], tv: false, goal: 'Goal · PSV' },
      lauKov: { sport: 'tennis', home: 'M. Laurent', away: 'D. Kovač', hs: [1, 4, '40'], as: [0, 5, '30'], serve: 'home', clock: 'Set 2', odds: [1.62, 2.25], labels: ['1', '2'], tv: true },
      reiOka: { sport: 'tennis', home: 'S. Reinholt', away: 'T. Okafor', hs: [0, 2, '15'], as: [1, 1, '0'], serve: 'away', clock: 'Set 2', odds: [3.10, 1.36], labels: ['1', '2'], tv: false },
      lakbos: { sport: 'basketball', home: 'Los Angeles Lakers', away: 'Boston Celtics', hs: [88], as: [91], clock: 'Q4 06:12', odds: [2.40, 1.57], labels: ['1', '2'], tv: true },
      nwiwol: { sport: 'esports', home: 'Northwind', away: 'Iron Wolves', hs: [1, 9], as: [0, 7], clock: 'Map 2', odds: [1.85, 1.95], labels: ['1', '2'], tv: true },
    };
    const prices = {};
    Object.keys(this.E).forEach((id) => this.E[id].odds.forEach((p, i) => { prices[id + '-' + i] = p; }));
    this.base = { ...prices };
    this.state = { prices, moves: {}, sel: { 'livmci-0': false }, filter: 'all', t: 0 };
  }

  componentDidMount() {
    this.timers = [];
    this.clock = setInterval(() => this.setState({ t: this.state.t + 1 }), 1000);
    this.flick = setInterval(() => this.flicker(), 1500);
  }

  componentWillUnmount() {
    clearInterval(this.clock);
    clearInterval(this.flick);
    (this.timers || []).forEach((t) => clearTimeout(t));
  }

  flicker() {
    const keys = Object.keys(this.state.prices).filter((k) => !this.state.sel[k] && !this.state.moves[k] && k.indexOf('ajapsv') !== 0);
    if (!keys.length) return;
    const k = keys[Math.floor(Math.random() * keys.length)];
    const p = this.state.prices[k];
    const step = p > 4 ? [0.1, 0.25, 0.5][Math.floor(Math.random() * 3)] : [0.02, 0.04, 0.05, 0.08][Math.floor(Math.random() * 4)];
    let up = Math.random() > 0.5;
    if (p - this.base[k] > 0.3) up = false;
    if (this.base[k] - p > 0.3) up = true;
    const next = Math.max(1.01, Math.round((up ? p + step : p - step) * 100) / 100);
    this.setState({ prices: { ...this.state.prices, [k]: next }, moves: { ...this.state.moves, [k]: up ? 'up' : 'down' } });
    this.timers.push(setTimeout(() => {
      const moves = { ...this.state.moves };
      delete moves[k];
      this.setState({ moves });
    }, 1600));
  }

  toggle(key) {
    const id = key.split('-')[0];
    const sel = { ...this.state.sel };
    const was = !!sel[key];
    [0, 1, 2].forEach((i) => { delete sel[id + '-' + i]; });
    if (!was) sel[key] = true;
    this.setState({ sel });
  }

  cell(id, i) {
    const s = this.state;
    const e = this.E[id];
    const key = id + '-' + i;
    const locked = !!e.goal;
    const on = !!s.sel[key];
    const mv = on || locked ? null : s.moves[key];
    const names = e.labels.length === 3 ? [e.home + ' to win', 'Draw', e.away + ' to win'] : [e.home + ' to win', e.away + ' to win'];
    return {
      label: e.labels[i],
      price: s.prices[key].toFixed(2),
      aria: locked ? 'Suspended' : names[i] + ' at ' + s.prices[key].toFixed(2),
      open: !locked,
      locked,
      pressed: on,
      up: mv === 'up',
      down: mv === 'down',
      bg: on ? 'linear-gradient(180deg, #f2c14e, #d8a32c)' : locked ? 'repeating-linear-gradient(135deg, #0f1512 0 5px, #141b17 5px 10px)' : mv === 'up' ? '#113224' : mv === 'down' ? '#331419' : '#151d18',
      border: on ? '#f2c14e' : locked ? '#223029' : mv === 'up' ? '#46c47c' : mv === 'down' ? '#ef5567' : '#33463a',
      glow: on ? '0 0 0 1px #f2c14e, 0 0 18px rgba(242, 193, 78, 0.45)' : 'none',
      labelColor: on ? '#16110a' : '#93a599',
      priceColor: on ? '#16110a' : '#f2c14e',
      toggle: () => { if (!locked) this.toggle(key); },
    };
  }

  scoreCells(arr, other, sport) {
    return arr.map((v, i) => {
      const last = i === arr.length - 1;
      const lead = Number(v) > Number(other[i]);
      const wide = sport === 'tennis' && last;
      return {
        v: String(v),
        w: wide ? '26px' : sport === 'basketball' ? '30px' : '18px',
        weight: last || sport !== 'tennis' ? 700 : 600,
        color: sport === 'tennis' && !last ? '#93a599' : (lead || sport === 'football' ? '#f2c14e' : '#eef3ec'),
      };
    });
  }

  renderVals() {
    const s = this.state;
    const E = this.E;
    const eventVals = (id) => {
      const e = E[id];
      let clock = e.clock;
      if (e.min !== undefined) {
        const total = e.min * 60 + e.sec + s.t;
        clock = Math.floor(total / 60) + "'";
      }
      return {
        home: e.home, away: e.away, clock,
        flash: !!e.goal, flashText: e.goal || '',
        tvLabel: e.tv ? 'Watch ' + e.home + ' v ' + e.away + ' live' : 'No stream for this event',
        tvColor: e.tv ? '#f2c14e' : '#64766b',
        statsLabel: 'Stats for ' + e.home + ' v ' + e.away,
        serveHome: e.serve === 'home' ? '#f2c14e' : 'transparent',
        serveAway: e.serve === 'away' ? '#f2c14e' : 'transparent',
        homeScore: this.scoreCells(e.hs, e.as, e.sport),
        awayScore: this.scoreCells(e.as, e.hs, e.sport),
        aria: e.home + ' v ' + e.away + ' prices',
        odds: e.odds.map((p, i) => this.cell(id, i)),
      };
    };
    const allGroups = [
      { sport: 'football', name: 'Premier League', region: 'England', cols: ['1', 'X', '2'], ids: ['livmci'] },
      { sport: 'football', name: 'Serie A', region: 'Italy', cols: ['1', 'X', '2'], ids: ['intjuv'] },
      { sport: 'football', name: 'Eredivisie', region: 'Netherlands', cols: ['1', 'X', '2'], ids: ['ajapsv'] },
      { sport: 'tennis', name: 'Vienna Indoor', region: 'Tennis · ATP', cols: ['1', '2'], ids: ['lauKov', 'reiOka'] },
      { sport: 'basketball', name: 'NBA Preseason', region: 'Basketball', cols: ['1', '2'], ids: ['lakbos'] },
      { sport: 'esports', name: 'Masters League', region: 'Esports', cols: ['1', '2'], ids: ['nwiwol'] },
    ];
    const groups = allGroups
      .filter((g) => s.filter === 'all' || g.sport === s.filter)
      .map((g) => ({ name: g.name, region: g.region, count: g.ids.length + ' live', events: g.ids.map(eventVals) }));
    const filterDefs = [
      { key: 'all', label: 'All', count: 24 },
      { key: 'football', label: 'Football', count: 11 },
      { key: 'tennis', label: 'Tennis', count: 6 },
      { key: 'basketball', label: 'Basketball', count: 4 },
      { key: 'esports', label: 'Esports', count: 3 },
    ];
    const filters = filterDefs.map((f) => {
      const on = s.filter === f.key;
      return {
        label: f.label, count: f.count, on,
        bg: on ? '#f2c14e' : '#151d18',
        border: on ? '#f2c14e' : '#223029',
        color: on ? '#16110a' : '#93a599',
        pick: () => this.setState({ filter: f.key }),
      };
    });
    const picked = Object.keys(s.sel).filter((k) => s.sel[k]);
    const total = picked.reduce((acc, k) => acc * s.prices[k], 4.73);
    const selCount = 2 + picked.length;
    return { filters, groups, hasSel: selCount > 0, selCount, totalOdds: total.toFixed(2) };
  }
}
</script>
