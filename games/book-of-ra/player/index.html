<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book of Ra — visual preview</title>
<style>
html,body{margin:0;min-height:100%;background:#000}body{min-height:100dvh;display:grid;place-items:center;overflow-x:hidden}
slot-game{display:block;width:min(100vw,var(--preview-width,1120px));max-width:min(100vw,var(--preview-width,1120px))!important;max-height:var(--preview-height,100dvh)!important;overflow:hidden}
@media(max-width:700px){body{align-items:center}slot-game{width:100%;max-width:100vw!important}}

/* Reference-matched preview sizing.

   Each approved capture has its own aspect ratio (--ref-ar = capture width /
   height). The player sizes the cabinet to that shape at up to 1120px of
   cabinet width and caps it so the page never gains document overflow.
   The player sets --preview-width on :root so the component's own inline-style
   reset cannot clear it. Portrait viewports (<=700px) keep the plain reflow. */
</style></head><body>
<slot-game chrome="immersive" presentation="classic"></slot-game>
<script type="module">
import { defineSlotGame } from './build/slot-client.js';
import { symbols, fixture } from './symbols.mjs';
defineSlotGame();
const game=await (await fetch('/game.json')).json();
const element=document.querySelector('slot-game');
const referenceState = new URLSearchParams(location.search).get('state') || '01-base';
element.setAttribute('reference-state', referenceState);
// Presentation-only preview sizing. Each approved capture has its own aspect
// ratio; sizing the cabinet to that shape at a capped width keeps the
// contain-normalised reference comparison about presentation, not scale.
const referenceAspect = {'01-base':1.64915,'02-paylines':1.33333,'03-paytable':1.77866,'04-win':1.86006,'05-free-games':1.79649,'06-gamble':1.77640,'07-autoplay':1.78298};
const applyPreviewSizing = () => {
  if (matchMedia('(max-width:700px)').matches) return;
  const aspect = referenceAspect[referenceState] ?? 1.6823;
  const wideLimit = Math.min(innerWidth, innerHeight * aspect, 1255);
  const tallLimit = Math.min(wideLimit / aspect, innerHeight, innerWidth / aspect);
  // The component clears its own inline width/height; a root custom property is
  // the one sizing channel it never resets.
  const style = document.documentElement.style;
  style.setProperty('--preview-width', `${Math.round(wideLimit)}px`);
  style.setProperty('--preview-height', `${Math.round(tallLimit)}px`);
  window.__previewSizing = { aspect, width: Math.round(wideLimit), height: Math.round(tallLimit), innerWidth, innerHeight };
};
applyPreviewSizing();
addEventListener('resize', applyPreviewSizing); addEventListener('orientationchange', applyPreviewSizing);
element.assetBaseUrl=new URL('/',location.href).href;
element.symbolPresentation=symbols;
element.titleImageUrl='player/assets/title-original-v2.png';
// Presentation-only copy. The compiled game, math and server remain untouched.
element.game={...game,title:'Book of Ra',symbols:game.symbols.map(symbol=>({...symbol,name:symbol.id==='scatter'?'Book':symbol.name}))};
const root=element.shadowRoot;
for(const [selector,text] of Object.entries(fixture.meters)) root.querySelector(selector).textContent=text;
try{const state=await (await fetch(`/v1/state/demo-player?gameId=${encodeURIComponent(game.id)}`)).json();if(state.pendingRound) await element.playResult(state.pendingRound);}catch(_error){/* first load may have no persisted round */}
document.documentElement.dataset.ready='true';
</script></body></html>
